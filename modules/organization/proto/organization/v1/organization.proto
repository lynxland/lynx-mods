syntax = "proto3";

package organization.v1;

option go_package = "github.com/lynxland/lynx-start/modules/organization/genproto/organization/v1;organizationv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "grpcapi/v1/policy.proto";

// 公开 API 面 + 文件级默认公开曝光。全部方法要求认证；成员资格与
// owner 校验在 app 层（v1 不做组织级 RBAC——角色/权限语义归 access
// 模块，proto 注解保持 authenticated）。
option (grpcapi.v1.api) = { api: "public", default_exposure: EXPOSURE_PUBLIC };

// OrganizationService 是组织模块的 API 面：组织与成员事实（结构 + 成员，
// 非 RBAC）。依赖 account 模块（DependsOn）：成员是账号（identity 域）用户
// （只存 ID），添加成员时校验用户存在。
service OrganizationService {
  // 创建组织，创建者即 owner。要求认证。
  rpc CreateOrganization(CreateOrganizationRequest) returns (Organization) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { post: "/v1/organizations" body: "*" };
  }

  // 取组织（仅成员可见）。要求认证。
  rpc GetOrganization(GetOrganizationRequest) returns (Organization) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { get: "/v1/organizations/{organization_id}" };
  }

  // 当前认证用户加入的组织（自助，分页）。要求认证。
  rpc ListMyOrganizations(ListMyOrganizationsRequest) returns (ListMyOrganizationsResponse) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { get: "/v1/my/organizations" };
  }

  // 改名（owner-only；slug 创建后不可变）。要求认证。
  rpc RenameOrganization(RenameOrganizationRequest) returns (Organization) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { patch: "/v1/organizations/{organization_id}" body: "*" };
  }

  // 加成员（owner-only；幂等）。要求认证。
  rpc AddMember(AddMemberRequest) returns (google.protobuf.Empty) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { post: "/v1/organizations/{organization_id}/members" body: "*" };
  }

  // 移除成员（owner-only；不可移除 owner；幂等）。要求认证。
  rpc RemoveMember(RemoveMemberRequest) returns (google.protobuf.Empty) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { delete: "/v1/organizations/{organization_id}/members/{user_id}" };
  }

  // 列成员（成员可见，分页）。要求认证。
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { get: "/v1/organizations/{organization_id}/members" };
  }

  // 成员自行离开（最后一个 owner 不可离开）。要求认证。
  rpc Leave(LeaveRequest) returns (google.protobuf.Empty) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { post: "/v1/organizations/{organization_id}:leave" body: "*" };
  }

  // 创建邀请（owner 或 admin）：生成一次性令牌投递到被邀邮箱（经
  // organization.invite.created 事件——通知渠道发信）；7 天过期；
  // 同组织同邮箱仅一个 pending。
  rpc CreateInvitation(CreateInvitationRequest) returns (Invitation) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { post: "/v1/organizations/{organization_id}/invitations" body: "*" };
  }

  // 列邀请（owner 或 admin）。
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { get: "/v1/organizations/{organization_id}/invitations" };
  }

  // 撤销邀请（owner 或 admin；幂等）。
  rpc RevokeInvitation(RevokeInvitationRequest) returns (google.protobuf.Empty) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { delete: "/v1/organizations/{organization_id}/invitations/{invitation_id}" };
  }

  // 接受邀请（自助——凭令牌；被邀邮箱须与当前账号邮箱一致）。
  rpc AcceptInvitation(AcceptInvitationRequest) returns (google.protobuf.Empty) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { post: "/v1/organizations/invitations:accept" body: "*" };
  }

  // 改成员角色（owner 或 admin；owner 角色只能经 TransferOwnership 变更）。
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (google.protobuf.Empty) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { patch: "/v1/organizations/{organization_id}/members/{user_id}/role" body: "*" };
  }

  // 转让所有权（owner-only）：新 owner 须为现有成员；转让后原 owner 降
  // 为 admin。解「单 owner 组织不可换主」死锁。
  rpc TransferOwnership(TransferOwnershipRequest) returns (google.protobuf.Empty) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { post: "/v1/organizations/{organization_id}:transfer-ownership" body: "*" };
  }

  // 删除组织（owner-only；软删——成员即时失去访问，数据保留供审计）。
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (google.protobuf.Empty) {
    option (grpcapi.v1.method) = { policy: { authenticated: true } };
    option (google.api.http) = { delete: "/v1/organizations/{organization_id}" };
  }
}

message Organization {
  string id = 1;
  string name = 2;
  string slug = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message OrganizationMember {
  string user_id = 1;
  bool is_owner = 2;
  google.protobuf.Timestamp joined_at = 3;
}

message CreateOrganizationRequest {
  string name = 1;
  string slug = 2;
}

message GetOrganizationRequest {
  string organization_id = 1;
}

message ListMyOrganizationsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListMyOrganizationsResponse {
  repeated Organization organizations = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message RenameOrganizationRequest {
  string organization_id = 1;
  string name = 2;
}

message AddMemberRequest {
  // 组织 ID（路径绑定 /v1/organizations/{organization_id}/members）。
  string organization_id = 1;
  string user_id = 2;
}

message RemoveMemberRequest {
  // 组织 ID（路径绑定 /v1/organizations/{organization_id}/members/{user_id}）。
  string organization_id = 1;
  string user_id = 2;
}

message ListMembersRequest {
  // 组织 ID（路径绑定 /v1/organizations/{organization_id}/members）。
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListMembersResponse {
  repeated OrganizationMember members = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message LeaveRequest {
  // 组织 ID（路径绑定 /v1/organizations/{organization_id}:leave）。
  string organization_id = 1;
}

// Invitation 是一条组织邀请（状态机：pending → accepted / revoked / expired）。
message Invitation {
  string id = 1;
  string organization_id = 2;
  string email = 3;
  string role = 4;             // 接受后授予的成员角色（admin/member）
  string status = 5;           // pending / accepted / revoked / expired
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateInvitationRequest {
  string organization_id = 1;
  string email = 2;
  string role = 3;             // admin/member（默认 member；不可为 owner）
}

message ListInvitationsRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListInvitationsResponse {
  repeated Invitation invitations = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message RevokeInvitationRequest {
  string organization_id = 1;
  string invitation_id = 2;
}

message AcceptInvitationRequest { string token = 1; }

message UpdateMemberRoleRequest {
  string organization_id = 1;
  string user_id = 2;
  string role = 3;             // admin/member
}

message TransferOwnershipRequest {
  string organization_id = 1;
  string new_owner_user_id = 2;
}

message DeleteOrganizationRequest { string organization_id = 1; }
